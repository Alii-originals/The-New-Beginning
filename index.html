<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The New Beginning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000000;
  --text:#ffffff;
  --muted:rgba(255,255,255,0.72);
  --muted2:rgba(255,255,255,0.52);
  --panel:rgba(255,255,255,0.035);
  --panelBorder:rgba(255,255,255,0.14);
  --edge:rgba(255,255,255,0.18);

  --titleFont:"Anton","Arial Narrow",Impact,sans-serif;
  --digitFont:"Anton","Arial Narrow",Impact,sans-serif;
  --tagFont:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000000;
  color:var(--text);
  text-align:center;
  overflow-y:auto;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:24px 0;
}

.container{
  width:min(980px,94vw);
  padding:44px 18px 52px;
  position:relative;
  z-index:1;
}

/* TITLE */
h1{
  margin:0 0 20px;
  font-family:var(--titleFont);
  font-weight:400;
  font-size:clamp(2rem,5vw,2.8rem);
  line-height:1;
  letter-spacing:-0.5px;
  text-transform:uppercase;
  color:#fff;
}

/* START DATE + WORLD CLOCKS */
.start-card{
  margin:0 auto 16px;
  width:min(720px,92vw);
  padding:16px;
  border-radius:0;
  background:var(--panel);
  border:1px solid var(--panelBorder);
}

.start{
  font-size:0.95rem;
  color:var(--muted);
  line-height:1.45;
  text-align:center;
}

.start strong{
  color:var(--text);
  word-break:break-word;
}

.now-list{
  margin-top:12px;
  display:grid;
  gap:7px;
  font-size:0.92rem;
  line-height:1.45;
  text-align:center;
}

/* TIMER */
.scoreboard{
  margin-top:24px;
  border:1px solid var(--edge);
  overflow:hidden;
}

.scoreboard-inner{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
}

.slot{
  padding:22px 14px;
  min-width:0;
  position:relative;
}

.slot + .slot{
  border-left:1px solid rgba(255,255,255,0.10);
}

/*
  DISTRESSED NUMBERS

  Mostly white with only a few soft,
  irregular dark worn areas.
*/
.digit{
  font-size:clamp(3.5rem,9vw,5.8rem);
  font-weight:400;
  line-height:0.95;
  overflow-wrap:anywhere;
  font-family:var(--digitFont);
  position:relative;
  z-index:2;
  letter-spacing:-2px;

  color:#fff;

  background:
    radial-gradient(
      ellipse 24% 9% at 18% 82%,
      rgba(0,0,0,.78) 0%,
      rgba(0,0,0,.52) 35%,
      rgba(0,0,0,.18) 60%,
      transparent 72%
    ),

    radial-gradient(
      ellipse 18% 7% at 74% 24%,
      rgba(0,0,0,.62) 0%,
      rgba(0,0,0,.34) 42%,
      transparent 72%
    ),

    radial-gradient(
      ellipse 28% 6% at 62% 68%,
      rgba(0,0,0,.50) 0%,
      rgba(0,0,0,.24) 45%,
      transparent 75%
    ),

    radial-gradient(
      ellipse 12% 5% at 35% 38%,
      rgba(0,0,0,.45) 0%,
      rgba(0,0,0,.20) 45%,
      transparent 75%
    ),

    linear-gradient(
      90deg,
      #f7f7f7 0%,
      #ffffff 25%,
      #eeeeee 48%,
      #ffffff 70%,
      #f4f4f4 100%
    );

  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tag{
  margin-top:10px;
  font-size:0.75rem;
  letter-spacing:2px;
  color:var(--muted2);
  font-family:var(--tagFont);
  position:relative;
  z-index:2;
  text-transform:uppercase;
}

/* Original ring structure retained */
.slot svg.ring{
  display:none;
}

.slot::after{
  content:none;
}

/* TABLET / MOBILE */
@media (max-width:768px){

  body{
    align-items:flex-start;
    padding:18px 0 28px;
  }

  .container{
    width:min(100%,94vw);
    padding:36px 10px;
  }

  h1{
    font-size:clamp(1.9rem,8vw,2.6rem);
    margin-bottom:20px;
  }

  .start-card{
    padding:14px 12px;
  }

  .now-list{
    font-size:0.9rem;
  }

  .scoreboard-inner{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .slot{
    padding:22px 10px;
  }

  .slot + .slot{
    border-left:none;
  }

  .slot:nth-child(even){
    border-left:1px solid rgba(255,255,255,0.10);
  }

  .slot:nth-child(n+3){
    border-top:1px solid rgba(255,255,255,0.10);
  }

  .digit{
    font-size:clamp(3rem,15vw,4.5rem);
  }

  .tag{
    font-size:0.72rem;
    letter-spacing:1.5px;
  }
}

/* SMALL PHONES */
@media (max-width:420px){

  .container{
    padding:30px 8px 28px;
  }

  h1{
    font-size:clamp(1.8rem,9vw,2.4rem);
  }

  .start{
    font-size:0.9rem;
  }

  .now-list{
    font-size:0.88rem;
  }

  .scoreboard-inner{
    grid-template-columns:1fr 1fr;
  }

  .digit{
    font-size:clamp(2.8rem,17vw,4rem);
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>The New Beginning</h1>

  <div class="start-card">

    <div class="start">
      Start Date and Time (Manchester, UK):<br>
      <strong id="startDisplay">--</strong>
    </div>

    <div class="now-list">

      <div id="nowManchester">
        Manchester, UK: <strong>--</strong>
      </div>

      <div id="nowJeddah">
        Jeddah, Saudi Arabia: <strong>--</strong>
      </div>

      <div id="nowHyderabad">
        Hyderabad, India: <strong>--</strong>
      </div>

    </div>

  </div>

  <div class="scoreboard">

    <div class="scoreboard-inner">

      <div class="slot" data-unit="days">

        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
          <circle class="ring-progress" cx="50" cy="50" r="42"></circle>
        </svg>

        <div class="digit" id="days">0</div>
        <div class="tag">Days</div>

      </div>

      <div class="slot" data-unit="hours">

        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
          <circle class="ring-progress" cx="50" cy="50" r="42"></circle>
        </svg>

        <div class="digit" id="hours">0</div>
        <div class="tag">Hours</div>

      </div>

      <div class="slot" data-unit="minutes">

        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
          <circle class="ring-progress" cx="50" cy="50" r="42"></circle>
        </svg>

        <div class="digit" id="minutes">0</div>
        <div class="tag">Minutes</div>

      </div>

      <div class="slot" data-unit="seconds">

        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
          <circle class="ring-progress" cx="50" cy="50" r="42"></circle>
        </svg>

        <div class="digit" id="seconds">0</div>
        <div class="tag">Seconds</div>

      </div>

    </div>

  </div>

</div>

<script>

/*
  29 September 2026
  15:45 BST = 14:45 UTC
*/
const startTime = Date.UTC(2026,8,29,14,45,0);

/*
  Device/browser time zone detection.
*/
const userTimeZone =
  Intl.DateTimeFormat().resolvedOptions().timeZone;

const CIRCUMFERENCE = 2 * Math.PI * 42;


/* LIVE WORLD CLOCKS */
function updateClock(id, label, tz){

  const now = new Date();

  const dateText = now.toLocaleDateString("en-GB", {
    timeZone:tz,
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });

  const timeText = now.toLocaleTimeString("en-GB", {
    timeZone:tz,
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit"
  });

  document.getElementById(id).innerHTML =
    `${label}: <strong>${dateText}, ${timeText}</strong>`;
}


/* RING CALCULATION RETAINED */
function setRingProgress(unit, fraction){

  const slot =
    document.querySelector(`.slot[data-unit="${unit}"]`);

  if(!slot) return;

  const ring =
    slot.querySelector(".ring-progress");

  if(!ring) return;

  const clamped =
    Math.max(0, Math.min(1, fraction));

  ring.style.strokeDasharray =
    CIRCUMFERENCE;

  ring.style.strokeDashoffset =
    CIRCUMFERENCE * (1 - clamped);
}


/* ELAPSED TIMER */
function updateTimer(){

  const diff =
    Date.now() - startTime;

  const s =
    Math.floor(diff / 1000);

  const totalDays =
    Math.floor(s / 86400);

  const hours =
    Math.floor((s % 86400) / 3600);

  const minutes =
    Math.floor((s % 3600) / 60);

  const seconds =
    s % 60;


  document.getElementById("days").textContent =
    totalDays;

  document.getElementById("hours").textContent =
    hours;

  document.getElementById("minutes").textContent =
    minutes;

  document.getElementById("seconds").textContent =
    seconds;


  const daysProgress =
    (totalDays % 365) / 365;

  const hoursProgress =
    hours / 24;

  const minutesProgress =
    minutes / 60;

  const secondsProgress =
    seconds / 60;


  setRingProgress(
    "days",
    daysProgress
  );

  setRingProgress(
    "hours",
    hoursProgress
  );

  setRingProgress(
    "minutes",
    minutesProgress
  );

  setRingProgress(
    "seconds",
    secondsProgress
  );
}


/* START DATE DISPLAY */
function updateStartDisplay(){

  const startDate =
    new Date(startTime);

  const dateText =
    startDate.toLocaleDateString("en-GB", {
      timeZone:userTimeZone,
      day:"2-digit",
      month:"long",
      year:"numeric"
    });

  const timeText =
    startDate.toLocaleTimeString("en-GB", {
      timeZone:userTimeZone,
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    });

  const zoneLabel =
    userTimeZone === "Europe/London"
      ? "(BST)"
      : "(Local Time zone)";

  document.getElementById(
    "startDisplay"
  ).textContent =
    `${dateText}, ${timeText} ${zoneLabel}`;
}


/* MAIN UPDATE */
function tick(){

  updateStartDisplay();

  updateClock(
    "nowManchester",
    "Manchester, UK",
    "Europe/London"
  );

  updateClock(
    "nowJeddah",
    "Jeddah, Saudi Arabia",
    "Asia/Riyadh"
  );

  updateClock(
    "nowHyderabad",
    "Hyderabad, India",
    "Asia/Kolkata"
  );

  updateTimer();
}


tick();

setInterval(
  tick,
  1000
);


/* PWA SERVICE WORKER */
if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register("./service-worker.js")

        .then(
          () =>
            console.log(
              "Service Worker registered"
            )
        )

        .catch(
          err =>
            console.error(
              "Service Worker registration failed:",
              err
            )
        );

    }
  );

}

</script>

</body>
</html>
