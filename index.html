
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The New Beginning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000000;
  --text:#ffffff;
  --muted:rgba(255,255,255,0.72);
  --muted2:rgba(255,255,255,0.52);
  --panel:rgba(255,255,255,0.035);
  --panelBorder:rgba(255,255,255,0.14);
  --edge:rgba(255,255,255,0.18);

  --titleFont:"Bookman Old Style","Bookman","URW Bookman",Georgia,serif;
  --digitFont:"Bookman Old Style","Bookman","URW Bookman",Georgia,serif;
  --tagFont:"Bookman Old Style","Bookman","URW Bookman",Georgia,serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000000;
  color:var(--text);
  text-align:center;
  overflow-y:auto;
  font-family:"Bookman Old Style","Bookman","URW Bookman",Georgia,serif;
  padding:24px 0;
}

.container{
  width:min(980px,94vw);
  padding:44px 18px 52px;
  position:relative;
  z-index:1;
}

/* TITLE */
h1{
  margin:0 0 20px;
  font-family:var(--titleFont);
  font-weight:400;
  font-size:1.5rem;
  line-height:1;
  letter-spacing:-0.5px;
  text-transform:uppercase;
  color:#fff;
}

/* HADITH BELOW TITLE */
.hadith{
  width:min(720px,92vw);
  margin:0 auto 12px;
  padding:0 12px;
  text-align:center;
  font-family:var(--titleFont);
}

h1{
  margin-bottom:12px;
}

.hadith-translation{
  font-size:0.95rem;
  font-weight:400;
  line-height:1.6;
  color:var(--muted);
  margin-bottom:5px;
}

.hadith-reference{
  font-size:0.8rem;
  font-weight:400;
  line-height:1.5;
  color:var(--muted2);
}

/* START DATE + WORLD CLOCKS */
.start-card{
  margin:0 auto 16px;
  width:min(720px,92vw);
  padding:16px;
  border-radius:0;
  background:var(--panel);
  border:1px solid var(--panelBorder);
}

.start{
  font-size:0.95rem;
  color:var(--muted);
  line-height:1.45;
  text-align:center;
}

.start strong{
  color:var(--text);
  word-break:break-word;
}

.now-list{
  margin-top:12px;
  display:grid;
  gap:7px;
  font-size:0.92rem;
  line-height:1.45;
  text-align:center;
}

/* TIMER */
.scoreboard{
  margin-top:24px;
  border:1px solid var(--edge);
  overflow:hidden;
}

.scoreboard-inner{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
}

.slot{
  padding:22px 14px;
  min-width:0;
  position:relative;
}

.slot + .slot{
  border-left:1px solid rgba(255,255,255,0.10);
}

/* DISTRESSED NUMBERS */
.digit{
  font-size:clamp(3.5rem,9vw,5.8rem);
  font-weight:400;
  line-height:0.95;
  overflow-wrap:anywhere;
  font-family:var(--digitFont);
  position:relative;
  z-index:2;
  letter-spacing:-2px;
  color:#fff;

  background:
    radial-gradient(
      ellipse 24% 9% at 18% 82%,
      rgba(0,0,0,.78) 0%,
      rgba(0,0,0,.52) 35%,
      rgba(0,0,0,.18) 60%,
      transparent 72%
    ),
    radial-gradient(
      ellipse 18% 7% at 74% 24%,
      rgba(0,0,0,.62) 0%,
      rgba(0,0,0,.34) 42%,
      transparent 72%
    ),
    radial-gradient(
      ellipse 28% 6% at 62% 68%,
      rgba(0,0,0,.50) 0%,
      rgba(0,0,0,.24) 45%,
      transparent 75%
    ),
    radial-gradient(
      ellipse 12% 5% at 35% 38%,
      rgba(0,0,0,.45) 0%,
      rgba(0,0,0,.20) 45%,
      transparent 75%
    ),
    linear-gradient(
      90deg,
      #f7f7f7 0%,
      #ffffff 25%,
      #eeeeee 48%,
      #ffffff 70%,
      #f4f4f4 100%
    );

  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tag{
  margin-top:10px;
  font-size:0.75rem;
  letter-spacing:2px;
  color:var(--muted2);
  font-family:var(--tagFont);
  position:relative;
  z-index:2;
  text-transform:uppercase;
}

.slot svg.ring{
  display:none;
}

.slot::after{
  content:none;
}

/* TABLET / MOBILE */
@media (max-width:768px){

  body{
    align-items:flex-start;
    padding:18px 0 28px;
  }

  .container{
    width:min(100%,94vw);
    padding:36px 10px;
  }

  h1{
    font-size:1.4rem;
    margin-bottom:12px;
  }

  .hadith{
    width:100%;
    margin-bottom:22px;
    padding:0 8px;
  }

  .hadith-translation{
    font-size:0.9rem;
  }

  .hadith-reference{
    font-size:0.75rem;
  }

  .start-card{
    padding:14px 12px;
  }

  .now-list{
    font-size:0.9rem;
  }

  .scoreboard-inner{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .slot{
    padding:22px 10px;
  }

  .slot + .slot{
    border-left:none;
  }

  .slot:nth-child(even){
    border-left:1px solid rgba(255,255,255,0.10);
  }

  .slot:nth-child(n+3){
    border-top:1px solid rgba(255,255,255,0.10);
  }

  .digit{
    font-size:clamp(3rem,15vw,4.5rem);
  }

  .tag{
    font-size:0.72rem;
    letter-spacing:1.5px;
  }
}

/* SMALL PHONES */
@media (max-width:420px){

  .container{
    padding:30px 8px 28px;
  }

  h1{
    font-size:1.3rem;
  }

  .start{
    font-size:0.9rem;
  }

  .now-list{
    font-size:0.88rem;
  }

  .digit{
    font-size:clamp(2.8rem,17vw,4rem);
  }
}

/* PASSWORD PROTECTION */
.auth-gate{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  font-family:var(--titleFont);
  color:#fff;
}

.auth-card{
  width:min(390px,100%);
  text-align:center;
}

.auth-card h2{
  font-size:1.5rem;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:-.5px;
  margin:0 0 28px;
}

.auth-card label{
  display:block;
  font-size:.95rem;
  color:var(--muted);
  margin-bottom:12px;
}

.auth-card input{
  display:block;
  width:100%;
  padding:15px 16px;
  background:var(--panel);
  border:1px solid var(--panelBorder);
  border-radius:0;
  color:#fff;
  font:inherit;
  font-size:1rem;
  text-align:center;
  outline:none;
}

.auth-card input:focus{
  border-color:rgba(255,255,255,.65);
}

.auth-card button{
  width:100%;
  margin-top:12px;
  padding:14px;
  background:#fff;
  color:#000;
  border:1px solid #fff;
  border-radius:0;
  font:inherit;
  font-size:.95rem;
  cursor:pointer;
}

.auth-card button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.auth-message{
  min-height:1.6em;
  margin-top:16px;
  color:var(--muted);
  font-size:.85rem;
  line-height:1.5;
}

body.auth-locked{
  overflow:hidden;
}

body.auth-locked>.container{
  visibility:hidden;
}

[hidden]{
  display:none!important;
}
</style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div class="auth-gate"
     id="authGate"
     role="dialog"
     aria-modal="true"
     aria-labelledby="authTitle">

  <form class="auth-card"
        id="authForm"
        autocomplete="off">

<h2 id="authTitle">
  Enter Password
</h2>
    <input
      id="authPassword"
      type="password"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      required
      aria-describedby="authMessage"
    >

    <button id="authSubmit" type="submit">
      Unlock
    </button>

    <div
      class="auth-message"
      id="authMessage"
      aria-live="polite">
    </div>

  </form>
</div>

<!-- ORIGINAL APPLICATION -->
<div class="container">

  <h1>The New Beginning</h1>

  <div class="hadith">

    <div class="hadith-translation">
      "Verily My Mercy overcomes My Anger"
    </div>

    <div class="hadith-reference">
      Bukhari 7404
    </div>

  </div>

  <div class="start-card">

    <div class="start">
      Start Date and Time (Manchester, UK):
      <br>
      <strong id="startDisplay">--</strong>
    </div>

    <div class="now-list">

      <div id="nowManchester">
        Manchester, UK: <strong>--</strong>
      </div>

      <div id="nowJeddah">
        Jeddah, Saudi Arabia: <strong>--</strong>
      </div>

      <div id="nowHyderabad">
        Hyderabad, India: <strong>--</strong>
      </div>

    </div>

  </div>

  <div class="scoreboard">

    <div class="scoreboard-inner">

      <div class="slot" data-unit="days">
        <div class="digit" id="days">0</div>
        <div class="tag">Days</div>
      </div>

      <div class="slot" data-unit="hours">
        <div class="digit" id="hours">0</div>
        <div class="tag">Hours</div>
      </div>

      <div class="slot" data-unit="minutes">
        <div class="digit" id="minutes">0</div>
        <div class="tag">Minutes</div>
      </div>

      <div class="slot" data-unit="seconds">
        <div class="digit" id="seconds">0</div>
        <div class="tag">Seconds</div>
      </div>

    </div>

  </div>

</div>

<script>

/*
  PASSWORD PROTECTION

  PBKDF2-SHA256
  310,000 iterations

  The original password is not stored
  as readable text in this file.
*/

const AUTH_SALT = [
  94,0,92,211,72,72,103,90,
  207,175,168,116,19,121,161,213
];

const AUTH_HASH = [
  98,112,124,209,65,117,131,20,
  29,191,91,184,49,180,198,190,
  92,243,188,230,207,42,142,234,
  31,27,211,137,67,10,108,238
];

const AUTH_ITERATIONS = 310000;

const AUTH_STATE_KEY =
  "newBeginningAuthAttemptsV1";

const AUTH_SESSION_KEY =
  "newBeginningUnlockedV1";

const AUTH_LOCK_MS =
  15 * 60 * 1000;

const gate =
  document.getElementById("authGate");

const authForm =
  document.getElementById("authForm");

const authInput =
  document.getElementById("authPassword");

const authButton =
  document.getElementById("authSubmit");

const authMessage =
  document.getElementById("authMessage");

let verifying = false;
let wasUnlocked = false;


/* REMEMBER INCORRECT ATTEMPTS */
function getAuthState(){

  try{

    const data = JSON.parse(
      localStorage.getItem(AUTH_STATE_KEY) || "{}"
    );

    return {
      attempts:Number.isInteger(data.attempts)
        ? Math.max(0,Math.min(3,data.attempts))
        : 0,

      until:Number.isFinite(data.until)
        ? data.until
        : 0
    };

  }catch{

    return {
      attempts:0,
      until:0
    };

  }
}


/* SAVE ATTEMPTS */
function setAuthState(state){

  localStorage.setItem(
    AUTH_STATE_KEY,
    JSON.stringify(state)
  );

}


/* LOCK APPLICATION */
function lockScreen(){

  wasUnlocked = false;

  sessionStorage.removeItem(
    AUTH_SESSION_KEY
  );

  document.body.classList.add(
    "auth-locked"
  );

  gate.hidden = false;

  authInput.value = "";

  refreshAuth();

}


/* UNLOCK APPLICATION */
function unlockScreen(){

  wasUnlocked = true;

  sessionStorage.setItem(
    AUTH_SESSION_KEY,
    "1"
  );

  document.body.classList.remove(
    "auth-locked"
  );

  gate.hidden = true;

  authInput.value = "";

  authMessage.textContent = "";

}


/* UPDATE LOCKOUT DISPLAY */
function refreshAuth(){

  if(wasUnlocked) return;

  const state = getAuthState();

  if(state.until > Date.now()){

    const remaining = Math.ceil(
      (state.until-Date.now())/1000
    );

    const mins = String(
      Math.floor(remaining/60)
    ).padStart(2,"0");

    const secs = String(
      remaining%60
    ).padStart(2,"0");

    authMessage.textContent =
      `Too many incorrect attempts. Try again in ${mins}:${secs}.`;

    authInput.disabled = true;
    authButton.disabled = true;

  }else{

    if(state.until){

      setAuthState({
        attempts:0,
        until:0
      });

    }

    authInput.disabled = verifying;
    authButton.disabled = verifying;

    if(state.until){

      authMessage.textContent =
        "You can try again.";

    }

  }

}


/* CRYPTOGRAPHIC PASSWORD VERIFICATION */
async function verifyPassword(value){

  if(!crypto.subtle){

    throw new Error(
      "Secure browser context required"
    );

  }

  const key = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(value),
    "PBKDF2",
    false,
    ["deriveBits"]
  );

  const result = new Uint8Array(
    await crypto.subtle.deriveBits(
      {
        name:"PBKDF2",
        salt:new Uint8Array(AUTH_SALT),
        iterations:AUTH_ITERATIONS,
        hash:"SHA-256"
      },
      key,
      256
    )
  );

  let difference = 0;

  for(let i=0;i<result.length;i++){

    difference |=
      result[i] ^ AUTH_HASH[i];

  }

  return difference === 0;

}


/* LOGIN PROCESS */
authForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    if(
      verifying ||
      getAuthState().until > Date.now()
    ){
      return;
    }

    verifying = true;

    refreshAuth();

    const candidate = authInput.value;

    authInput.value = "";

    try{

      if(await verifyPassword(candidate)){

        setAuthState({
          attempts:0,
          until:0
        });

        unlockScreen();

      }else{

        const state = getAuthState();

        const attempts =
          state.attempts + 1;

        if(attempts >= 3){

          setAuthState({
            attempts:3,
            until:Date.now()+AUTH_LOCK_MS
          });

        }else{

          setAuthState({
            attempts,
            until:0
          });

          authMessage.textContent =
            `Incorrect password. ${3-attempts} ${3-attempts===1?"attempt":"attempts"} remaining.`;

        }

      }

    }catch{

      authMessage.textContent =
        "Password verification requires HTTPS or localhost.";

    }finally{

      verifying = false;

      refreshAuth();

      if(
        !authInput.disabled &&
        !wasUnlocked
      ){

        authInput.focus();

      }

    }

  }
);


/* LOCK WHEN LEAVING APPLICATION */
document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.hidden &&
      wasUnlocked
    ){

      lockScreen();

    }

  }
);


/* CLEAR UNLOCKED SESSION ON EXIT */
window.addEventListener(
  "pagehide",
  () => {

    sessionStorage.removeItem(
      AUTH_SESSION_KEY
    );

  }
);


/* REQUIRE PASSWORD ON REOPEN */
window.addEventListener(
  "pageshow",
  () => {

    if(!wasUnlocked){

      lockScreen();

    }

  }
);


/* INITIAL PASSWORD SCREEN */
document.body.classList.add(
  "auth-locked"
);

lockScreen();

setInterval(
  refreshAuth,
  1000
);


/*
  ORIGINAL TIMER
  15 November 2026
  23:40 UTC
*/
const startTime =
  Date.UTC(2026,10,15,23,40,0);


/* DEVICE TIME ZONE */
const userTimeZone =
  Intl.DateTimeFormat()
    .resolvedOptions().timeZone;


/* WORLD CLOCKS */
function updateClock(id,label,tz){

  const now = new Date();

  const dateText = now.toLocaleDateString(
    "en-GB",
    {
      timeZone:tz,
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

  const timeText = now.toLocaleTimeString(
    "en-GB",
    {
      timeZone:tz,
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );

  document.getElementById(id).innerHTML =
    `${label}: <strong>${dateText}, ${timeText}</strong>`;

}


/* ELAPSED TIMER */
function updateTimer(){

  const diff =
    Date.now()-startTime;

  const s =
    Math.floor(diff/1000);

  const totalDays =
    Math.floor(s/86400);

  const hours =
    Math.floor((s%86400)/3600);

  const minutes =
    Math.floor((s%3600)/60);

  const seconds =
    s%60;

  document.getElementById(
    "days"
  ).textContent = totalDays;

  document.getElementById(
    "hours"
  ).textContent = hours;

  document.getElementById(
    "minutes"
  ).textContent = minutes;

  document.getElementById(
    "seconds"
  ).textContent = seconds;

}


/* START DATE DISPLAY */
function updateStartDisplay(){

  const startDate =
    new Date(startTime);

  const dateText =
    startDate.toLocaleDateString(
      "en-GB",
      {
        timeZone:userTimeZone,
        day:"2-digit",
        month:"long",
        year:"numeric"
      }
    );

  const timeText =
    startDate.toLocaleTimeString(
      "en-GB",
      {
        timeZone:userTimeZone,
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
      }
    );

  const zoneLabel =
    "(" +
    (
      {
        "Europe/London":"GMT",
        "Asia/Riyadh":"AST",
        "Asia/Kolkata":"IST"
      }[userTimeZone] ||

      new Intl.DateTimeFormat(
        "en-GB",
        {
          timeZone:userTimeZone,
          timeZoneName:"short"
        }
      )
      .formatToParts(startDate)
      .find(
        part => part.type==="timeZoneName"
      )
      ?.value ||

      userTimeZone
    ) +
    ")";

  document.getElementById(
    "startDisplay"
  ).textContent =
    `${dateText}, ${timeText} ${zoneLabel}`;

}


/* MAIN UPDATE */
function tick(){

  updateStartDisplay();

  updateClock(
    "nowManchester",
    "Manchester, UK",
    "Europe/London"
  );

  updateClock(
    "nowJeddah",
    "Jeddah, Saudi Arabia",
    "Asia/Riyadh"
  );

  updateClock(
    "nowHyderabad",
    "Hyderabad, India",
    "Asia/Kolkata"
  );

  updateTimer();

}

tick();

setInterval(
  tick,
  1000
);


/* PWA SERVICE WORKER */
if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register("./service-worker.js")

        .then(
          () => console.log(
            "Service Worker registered"
          )
        )

        .catch(
          err => console.error(
            "Service Worker registration failed:",
            err
          )
        );

    }
  );

}

</script>

</body>
</html>
